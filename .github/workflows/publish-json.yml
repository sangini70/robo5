name: Publish JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-json
  cancel-in-progress: false

jobs:
  sync-json:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check scheduled publication gate
        id: gate
        if: github.event_name == 'schedule'
        run: node scripts/check-pending-scheduled-publication.mjs
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_FILE: publish-json.yml
          GITHUB_BRANCH: main

      - name: No pending scheduled posts
        if: github.event_name == 'schedule' && steps.gate.outputs.has_pending_publication != 'true'
        run: echo "No pending scheduled posts detected. Skipping sync-json."

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true'
        run: npm ci

      - name: Generate public JSON
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true'
        run: npm run sync-json
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Sync with latest main before checking generated JSON
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true'
        shell: bash
        run: |
          git fetch origin main
          git rebase --autostash origin/main

      - name: Validate generated JSON files
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = path.join(process.cwd(), 'public', 'data');
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (entry.isFile() && entry.name.endsWith('.json')) {
                files.push(fullPath);
              }
            }
          }

          walk(root);

          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            if (/^(<<<<<<<|=======|>>>>>>>)$/m.test(text)) {
              throw new Error(`Conflict marker found in ${path.relative(process.cwd(), file)}`);
            }
            JSON.parse(text);
          }
          NODE

      - name: Check public data changes
        id: changes
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --short -- public/data)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --short -- public/data
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated JSON
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true') && steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(sync): regenerate public JSON [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: No generated JSON changes
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.has_pending_publication == 'true') && steps.changes.outputs.has_changes != 'true'
        run: echo "No public data changes detected."
